<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23006CCF'/><path d='M50 18 C50 18 28 30 28 50 C28 62 35 70 42 74 L42 60 C38 57 36 54 36 50 C36 38 50 28 50 28 C50 28 64 38 64 50 C64 54 62 57 58 60 L58 74 C65 70 72 62 72 50 C72 30 50 18 50 18Z' fill='white'/><rect x='44' y='58' width='12' height='24' rx='4' fill='white'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MuleSoft Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before React mounts to avoid a flash of the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem('mule_theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
